<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Football GM — Soccer Management Sim</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
<!-- One shield mask shared by every club crest on the page (see js/crests.js). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><clipPath id="fgmShield"><path d="M5 4 H59 V37 C59 53.5 45.5 65.5 32 70.5 C18.5 65.5 5 53.5 5 37 Z"/></clipPath></defs>
</svg>
<div id="app">
  <header id="topbar">
    <div class="topbar-left">
      <button id="nav-toggle" title="Toggle menu">☰</button>
      <span class="logo">⚽ <strong>Football GM</strong></span>
      <span id="top-team" class="top-team"></span>
    </div>
    <div class="topbar-right">
      <span id="top-status" class="top-status"></span>
      <div class="play-menu">
        <button id="play-btn" class="btn btn-play">Play ▾</button>
        <div id="play-dropdown" class="play-dropdown hidden">
          <button data-sim="watch">▶ Watch next match (live)</button>
          <button data-sim="one">Sim next week</button>
          <button data-sim="month">Sim 4 weeks</button>
          <button data-sim="season">Sim to end of season</button>
          <button data-sim="offseason" id="play-offseason">Continue to next season</button>
        </div>
      </div>
    </div>
  </header>

  <div id="main">
    <nav id="sidebar">
      <a href="#dashboard" data-view="dashboard">🏠 Dashboard</a>
      <a href="#roster" data-view="roster">👥 Roster</a>
      <a href="#tactics" data-view="tactics">🧠 Tactics</a>
      <a href="#standings" data-view="standings">🏆 League Table</a>
      <a href="#fixtures" data-view="fixtures">📅 Fixtures &amp; Results</a>
      <a href="#europe" data-view="europe">⭐ Europe (UCL &amp; UEL)</a>
      <a href="#cups" data-view="cups">🏆 Domestic Cups</a>
      <a href="#stats" data-view="stats">📊 Stat Leaders</a>
      <a href="#players" data-view="players">🌍 All Players</a>
      <a href="#search" data-view="search">🔎 Search Players</a>
      <a href="#transfers" data-view="transfers">💸 Transfer Market</a>
      <a href="#finances" data-view="finances">💰 Finances</a>
      <a href="#review" data-view="review">🏅 Season Review</a>
      <a href="#history" data-view="history">📜 League History</a>
      <a href="#news" data-view="news">📰 News Feed</a>
      <a href="#settings" data-view="settings">⚙️ Settings</a>
    </nav>
    <section id="content"></section>
  </div>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal">
    <button id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<nav id="bottom-nav">
  <a href="#dashboard" data-view="dashboard">🏠<span>Home</span></a>
  <a href="#roster" data-view="roster">👥<span>Squad</span></a>
  <a href="#tactics" data-view="tactics">🧠<span>Tactics</span></a>
  <a href="#standings" data-view="standings">🏆<span>Table</span></a>
  <a href="#transfers" data-view="transfers">💸<span>Market</span></a>
  <a href="javascript:void(0)" data-view="menu">☰<span>More</span></a>
</nav>

<script src="js/names.js"></script>
<script src="js/players.js"></script>
<script src="js/leagues1.js"></script>
<script src="js/leagues2.js"></script>
<script src="js/world.js"></script>
<script src="js/legends.js"></script>
<script src="js/awards.js"></script>
<script src="js/crests.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
